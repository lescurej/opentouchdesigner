[package]
name = "otd-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.35.0", features = ["wgpu"] }
egui = "0.35.0"
egui_extras = { version = "0.35.0", default-features = false, features = ["syntect"] }
env_logger = "0.11.11"
log = "0.4.33"
otd-chop = { workspace = true }
otd-core = { workspace = true }
otd-dat = { workspace = true }
otd-engine = { workspace = true }
otd-td = { workspace = true }
otd-ai = { workspace = true }
otd-gpu = { workspace = true }
raw-window-handle = "0.6.2"
rfd = "0.17.2"
wgpu = "29"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSArray", "NSProcessInfo", "NSString", "NSURL", "NSObject"] }
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSScreen"] }

[lints]
workspace = true
