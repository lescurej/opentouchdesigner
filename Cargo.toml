[workspace]
resolver = "2"
members = ["crates/otd-core", "crates/otd-gpu", "crates/otd-app", "crates/otd-chop", "crates/otd-engine", "crates/otd-py", "crates/otd-dat", "crates/otd-sop", "crates/otd-cli", "crates/otd-ai", "crates/otd-td", "crates/otd-audio", "crates/otd-panel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ar9av/opentouchdesigner"
rust-version = "1.85"

[workspace.dependencies]
otd-core = { path = "crates/otd-core" }
otd-chop = { path = "crates/otd-chop" }
otd-gpu = { path = "crates/otd-gpu" }
otd-ai = { path = "crates/otd-ai" }
otd-engine = { path = "crates/otd-engine" }
otd-audio = { path = "crates/otd-audio" }
otd-app = { path = "crates/otd-app" }
otd-dat = { path = "crates/otd-dat" }
otd-sop = { path = "crates/otd-sop" }
otd-py = { path = "crates/otd-py" }
otd-cli = { path = "crates/otd-cli" }
otd-td = { path = "crates/otd-td" }
otd-panel = { path = "crates/otd-panel" }

[profile.dev]
# The cook loop is unusably slow in a fully unoptimised build; dependencies
# (wgpu, naga, image codecs) get optimised even in dev.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
